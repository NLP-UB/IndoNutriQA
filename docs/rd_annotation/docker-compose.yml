# Label Studio for the IndoNutriQA RD annotation study.
#
#   cd docs/rd_annotation && docker compose up -d
#
# Then open http://<server>:8080 and sign up — the first account created
# becomes the owner of the organisation.
#
# Pin the image tag to a specific release before the study starts so the two
# RDs never see a mid-study UI change. Replace `latest` with the tag you
# actually pull (`docker image inspect heartexlabs/label-studio:latest \
# --format '{{index .RepoDigests 0}}'` records the exact digest).

services:
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: indonutriqa-label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Disable the signup page after both RD accounts exist, so the instance
      # is not open to the internet.
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "false"

      # Required when serving over a domain/reverse proxy. Set to the URL the
      # RDs actually type; leave unset for plain http://<ip>:8080 access.
      # LABEL_STUDIO_HOST: "https://annotate.example.ac.id"

      # Lets you import tasks from a mounted local path rather than uploading.
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: "/label-studio/files"

      # Postgres instead of the default SQLite. Uncomment together with the
      # `db` service below if you expect concurrent annotation by both RDs;
      # SQLite is adequate for two raters on 50 units.
      # DJANGO_DB: default
      # POSTGRE_NAME: labelstudio
      # POSTGRE_USER: labelstudio
      # POSTGRE_PASSWORD: change-me
      # POSTGRE_PORT: "5432"
      # POSTGRE_HOST: db
    volumes:
      # Annotation database and media. BACK THIS UP — it holds the RD labels.
      - ./ls-data:/label-studio/data
      # Read-only mount of the generated task file.
      - ../../data/18-rd_judge_agreement:/label-studio/files:ro

